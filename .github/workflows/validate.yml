name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Test static Docker artifact
        if: matrix.node == 22
        run: |
          docker build -t portfolio:test .
          docker run -d --name portfolio-test -p 127.0.0.1:8080:80 portfolio:test
          trap 'docker rm -f portfolio-test' EXIT
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8080/ -o /tmp/portfolio.html && break || sleep 2; done
          grep -q 'engineering-studio-v1' /tmp/portfolio.html
          for path in assets/styles.css assets/app.js assets/content.js public/profile.jpeg; do
            curl -fsS "http://127.0.0.1:8080/$path" -o /dev/null
          done
